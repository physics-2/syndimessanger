<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Массовая рассылка по тегам</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
            --success: #10b981;
            --error: #ef4444;
            --warning: #f59e0b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            height: fit-content;
        }

        h1 {
            margin-top: 0;
            font-size: 1.5rem;
            text-align: center;
            color: var(--text);
            margin-bottom: 1.5rem;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            font-size: 0.875rem;
        }

        input[type="text"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .checkbox-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            padding: 0.75rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            background: #fafafa;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .checkbox-item input {
            width: auto;
        }

        button {
            width: 100%;
            padding: 0.875rem;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 1rem;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: #9ca3af;
            cursor: not-allowed;
        }

        .results {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            display: none;
        }

        .result-card {
            background: #f9fafb;
            padding: 1rem;
            border-radius: 6px;
            margin-bottom: 0.75rem;
            border-left: 4px solid var(--border);
        }

        .result-card.success { border-left-color: var(--success); }
        .result-card.error { border-left-color: var(--error); }
        .result-card.processing { border-left-color: var(--warning); }

        .stat-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            color: white;
        }
        .bg-success { background-color: var(--success); }
        .bg-error { background-color: var(--error); }
        .bg-warning { background-color: var(--warning); }
        .bg-primary { background-color: var(--primary); }

        .helper-text {
            font-size: 0.75rem;
            color: #6b7280;
            margin-top: 0.25rem;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 Массовая рассылка</h1>

    <form id="broadcastForm">
        <!-- Выбор платформ -->
        <div class="form-group">
            <label>Платформы отправки</label>
            <div class="checkbox-group">
                <label class="checkbox-item">
                    <input type="checkbox" name="platforms" value="all" id="checkAll">
                    <strong>Все платформы</strong>
                </label>
                <div style="height: 1px; background: #e5e7eb; margin: 4px 0;"></div>
                <label class="checkbox-item">
                    <input type="checkbox" name="platforms" value="vk">
                    <span style="color: #0077FF;">●</span> ВКонтакте
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="platforms" value="telegram">
                    <span style="color: #24A1DE;">●</span> Telegram
                </label>
                <label class="checkbox-item">
                    <input type="checkbox" name="platforms" value="max">
                    <span style="color: #FF5722;">●</span> MAX
                </label>
            </div>
        </div>

        <!-- Теги -->
        <div class="form-group">
            <label for="tags">Теги получателей</label>
            <input type="text" id="tags" name="tags" placeholder="vip, active, new" required>
            <div class="helper-text">Перечислите теги через запятую. Сообщение получат пользователи с любым из указанных тегов.</div>
        </div>

        <!-- Сообщение -->
        <div class="form-group">
            <label for="message">Текст сообщения</label>
            <textarea id="message" name="message" placeholder="Введите текст рассылки..." required></textarea>
        </div>

        <!-- Вложения -->
        <div class="form-group">
            <label for="attachments">Вложения (опционально)</label>
            <input type="text" id="attachments" name="attachments" placeholder="photo123_456, doc789_000">
            <div class="helper-text">Формат строки: typeOwnerID (например, photo-123_456). Оставьте пустым, если не нужно.</div>
        </div>

        <button type="submit" id="submitBtn">Отправить рассылку</button>
    </form>

    <!-- Результаты -->
    <div id="resultsArea" class="results">
        <h3>Результаты отправки</h3>
        <div id="resultsContent"></div>
    </div>
</div>

<script>
    const form = document.getElementById('broadcastForm');
    const resultsArea = document.getElementById('resultsArea');
    const resultsContent = document.getElementById('resultsContent');
    const submitBtn = document.getElementById('submitBtn');
    const checkAll = document.getElementById('checkAll');
    const platformChecks = document.querySelectorAll('input[name="platforms"]:not(#checkAll)');

    // Логика "Выбрать все"
    checkAll.addEventListener('change', (e) => {
        platformChecks.forEach(cb => cb.checked = e.target.checked);
    });

    platformChecks.forEach(cb => {
        cb.addEventListener('change', () => {
            const allChecked = Array.from(platformChecks).every(c => c.checked);
            checkAll.checked = allChecked;

            if (!allChecked && checkAll.checked) {
                // Если сняли галочку с одного, снимаем с "Все"
                // (уже сделано выше логикой every, но на всякий случай синхронизируем визуал)
            }
        });
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        // Сбор данных
        const selectedPlatforms = Array.from(document.querySelectorAll('input[name="platforms"]:checked'))
            .map(cb => cb.value)
            .filter(v => v !== 'all'); // 'all' обрабатываем отдельно

        // Если выбрано "Все", игнорируем конкретные чебоксы и берем все доступные
        const isAllSelected = document.getElementById('checkAll').checked;
        const finalPlatforms = isAllSelected ? ['vk', 'telegram', 'max'] : selectedPlatforms;

        if (finalPlatforms.length === 0) {
            alert('Выберите хотя бы одну платформу!');
            return;
        }

        const tagsInput = document.getElementById('tags').value;
        const tags = tagsInput.split(',').map(t => t.trim()).filter(t => t.length > 0);

        if (tags.length === 0) {
            alert('Введите хотя бы один тег!');
            return;
        }

        const payload = {
            tags: tags,
            message: document.getElementById('message').value,
            attachments: document.getElementById('attachments').value.trim() || null
        };

        // UI обновление
        submitBtn.disabled = true;
        submitBtn.textContent = 'Отправка...';
        resultsArea.style.display = 'block';
        resultsContent.innerHTML = '';

        // Запуск параллельных запросов
        const promises = finalPlatforms.map(platform => sendBroadcast(platform, payload));

        try {
            await Promise.all(promises);
        } catch (error) {
            console.error('Global error:', error);
        } finally {
            submitBtn.disabled = false;
            submitBtn.textContent = 'Отправить рассылку';
        }
    });

    async function sendBroadcast(platform, data) {
        const cardId = `res-${platform}`;

        // Создаем карточку результата
        const card = document.createElement('div');
        card.className = 'result-card processing';
        card.id = cardId;
        card.innerHTML = `
            <div class="stat-row">
                <strong>${getPlatformName(platform)}</strong>
                <span class="badge bg-warning">В процессе</span>
            </div>
            <div class="stat-row" style="margin-top:5px; color: #6b7280;">
                <span>Ожидание ответа...</span>
            </div>
        `;
        resultsContent.appendChild(card);

        try {
            // Формируем URL. Предполагаем, что бэкэнд принимает query параметр connectorType
            // Или мы можем менять тело запроса.
            // В предыдущем ответе я предложил единый эндпоинт /api/v2/broadcast с полем connectorType в теле.
            // Сделаем так.

            const bodyPayload = {
                ...data,
                connectorType: platform
            };

            const response = await fetch('/api/v2/broadcast', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(bodyPayload)
            });

            const resultData = await response.json();

            // Обновляем карточку
            card.className = 'result-card ' + (response.ok ? 'success' : 'error');

            let statsHtml = '';
            if (resultData.data) {
                statsHtml = `
                    <div class="stat-row"><span>Всего:</span> <strong>${resultData.data.totalRecipients || 0}</strong></div>
                    <div class="stat-row"><span>Успешно:</span> <span class="badge bg-success">${resultData.data.successCount || 0}</span></div>
                    <div class="stat-row"><span>Ошибки:</span> <span class="badge bg-error">${resultData.data.failedCount || 0}</span></div>
                `;
            } else {
                statsHtml = `<div class="stat-row"><span>Статус:</span> ${response.ok ? 'OK' : 'Error'}</div>`;
            }

            card.innerHTML = `
                <div class="stat-row">
                    <strong>${getPlatformName(platform)}</strong>
                    <span class="badge ${response.ok ? 'bg-success' : 'bg-error'}">${response.ok ? 'Готово' : 'Ошибка'}</span>
                </div>
                ${statsHtml}
                ${!response.ok ? `<div style="color:var(--error); font-size:0.8rem; margin-top:5px;">${resultData.message || 'Неизвестная ошибка'}</div>` : ''}
            `;

        } catch (err) {
            card.className = 'result-card error';
            card.innerHTML = `
                <div class="stat-row">
                    <strong>${getPlatformName(platform)}</strong>
                    <span class="badge bg-error">Сбой сети</span>
                </div>
                <div style="color:var(--error); font-size:0.8rem; margin-top:5px;">${err.message}</div>
            `;
        }
    }

    function getPlatformName(key) {
        const names = {
            'vk': 'ВКонтакте',
            'telegram': 'Telegram',
            'max': 'MAX'
        };
        return names[key] || key;
    }
</script>

</body>
</html>
